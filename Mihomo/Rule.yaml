rules:
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT-DROP
  - AND,((NETWORK,UDP),(DST-PORT,3478/19302)),REJECT-DROP
  - DST-PORT,853,REJECT

  - AND,((RULE-SET,connectivity-check),(DST-PORT,80)),DIRECT
  - RULE-SET,private,DIRECT
  - RULE-SET,reject-drop,REJECT-DROP
  - RULE-SET,reject,REJECT

  - RULE-SET,speedtest,Proxy

  - RULE-SET,ai@cn,DIRECT
  - RULE-SET,google@cn,DIRECT
  - RULE-SET,microsoft@cn,DIRECT
  - RULE-SET,game@cn,DIRECT

  - RULE-SET,ai,AI
  - RULE-SET,streaming,Streaming
  - RULE-SET,telegram,Proxy
  - RULE-SET,game,Proxy

  - RULE-SET,apple@cn,DIRECT
  - RULE-SET,apple-services,DIRECT
  - RULE-SET,neteasemusic,DIRECT

  - RULE-SET,download,CDN
  - RULE-SET,cdn,CDN
  - RULE-SET,apple,Proxy
  - RULE-SET,microsoft,Proxy

  - RULE-SET,direct,DIRECT
  - RULE-SET,proxy,Proxy
  - RULE-SET,domestic,DIRECT

  - IP-CIDR,127.0.0.0/8,REJECT
  - IP-CIDR,0.0.0.0/32,REJECT,no-resolve
  - IP-CIDR6,::1/128,REJECT,no-resolve
  - IP-CIDR6,::/128,REJECT,no-resolve
  - RULE-SET,private@ip,DIRECT,no-resolve
  - RULE-SET,reject@ip,REJECT,no-resolve
  - RULE-SET,ai@ip,AI,no-resolve
  - RULE-SET,streaming@ip,Streaming,no-resolve
  - RULE-SET,telegram@ip,Proxy,no-resolve
  - RULE-SET,game@ip,Proxy,no-resolve
  - RULE-SET,neteasemusic@ip,DIRECT,no-resolve
  - RULE-SET,download@ip,CDN,no-resolve
  - RULE-SET,cdn@ip,CDN,no-resolve
  - RULE-SET,domestic@ip,DIRECT

  - MATCH,Final

